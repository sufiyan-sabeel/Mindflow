name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: >
          ./gradlew testDebugUnitTest --stacktrace
          -Pmindflow.supabaseUrl="${{ secrets.MINDFLOW_SUPABASE_URL }}"
          -Pmindflow.supabaseAnonKey="${{ secrets.MINDFLOW_SUPABASE_ANON_KEY }}"

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --stacktrace
          -Pmindflow.supabaseUrl="${{ secrets.MINDFLOW_SUPABASE_URL }}"
          -Pmindflow.supabaseAnonKey="${{ secrets.MINDFLOW_SUPABASE_ANON_KEY }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build runs only when a signing keystore is provided as secrets.
      # MINDFLOW_KEYSTORE_BASE64 = base64 of the .jks file.
      - name: Decode keystore
        if: ${{ secrets.MINDFLOW_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.MINDFLOW_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mindflow.jks"

      - name: Build release APK
        if: ${{ secrets.MINDFLOW_KEYSTORE_BASE64 != '' }}
        run: >
          ./gradlew assembleRelease --stacktrace
          -Pmindflow.supabaseUrl="${{ secrets.MINDFLOW_SUPABASE_URL }}"
          -Pmindflow.supabaseAnonKey="${{ secrets.MINDFLOW_SUPABASE_ANON_KEY }}"
          -Pmindflow.storeFile="$RUNNER_TEMP/mindflow.jks"
          -Pmindflow.storePassword="${{ secrets.MINDFLOW_STORE_PASSWORD }}"
          -Pmindflow.keyAlias="${{ secrets.MINDFLOW_KEY_ALIAS }}"
          -Pmindflow.keyPassword="${{ secrets.MINDFLOW_KEY_PASSWORD }}"

      - name: Upload release APK
        if: ${{ secrets.MINDFLOW_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
