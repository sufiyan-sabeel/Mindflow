name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets are exposed as job-level env vars. The `secrets` context is NOT
    # available inside a step-level `if:`, and referencing it there makes the
    # whole workflow invalid (the run then starts with zero jobs). The `env`
    # context IS available in `if:`, so the optional steps key off env instead.
    env:
      SUPABASE_URL: ${{ secrets.MINDFLOW_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.MINDFLOW_SUPABASE_ANON_KEY }}
      KEYSTORE_B64: ${{ secrets.MINDFLOW_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.MINDFLOW_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MINDFLOW_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MINDFLOW_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The wrapper is committed via the GitHub API, which does not preserve the
      # executable bit, so restore it before invoking ./gradlew.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: >
          ./gradlew testDebugUnitTest --stacktrace
          -Pmindflow.supabaseUrl="$SUPABASE_URL"
          -Pmindflow.supabaseAnonKey="$SUPABASE_ANON_KEY"

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --stacktrace
          -Pmindflow.supabaseUrl="$SUPABASE_URL"
          -Pmindflow.supabaseAnonKey="$SUPABASE_ANON_KEY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build runs only when a signing keystore is supplied as a secret.
      # MINDFLOW_KEYSTORE_BASE64 = base64 -w0 of the .jks file.
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mindflow.jks"

      - name: Build release APK
        if: env.KEYSTORE_B64 != ''
        run: >
          ./gradlew assembleRelease --stacktrace
          -Pmindflow.supabaseUrl="$SUPABASE_URL"
          -Pmindflow.supabaseAnonKey="$SUPABASE_ANON_KEY"
          -Pmindflow.storeFile="$RUNNER_TEMP/mindflow.jks"
          -Pmindflow.storePassword="$STORE_PASSWORD"
          -Pmindflow.keyAlias="$KEY_ALIAS"
          -Pmindflow.keyPassword="$KEY_PASSWORD"

      - name: Upload release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
